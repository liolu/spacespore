[package]
name = "spacespore-updater"
version = "0.1.0"
edition = "2021"

[dependencies]
spacespore-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }
