[package]
name = "spacespore-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
spacespore-common = { path = "../common" }
ureq = { version = "3", features = ["native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
native-windows-gui = "1.0"
native-windows-derive = "1.0"

[build-dependencies]
embed-resource = "2"
