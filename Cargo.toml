[workspace]
resolver = "2"
members = [".", "tools/common", "tools/installer", "tools/updater", "tools/launcher"]

[package]
name = "spacespore"
version = "0.6.4"
edition = "2021"

[dependencies]
spacespore-common = { path = "tools/common" }
bevy = { version = "0.15", features = ["wayland"] }
noise = "0.9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = "0.4"
ureq = { version = "3", features = ["native-tls"], default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
igd-next = { version = "0.17.1", default-features = false }
arboard = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
