name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          # Ubuntu 22.04 : glibc plus ancienne = binaire compatible avec plus de distributions
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev zip

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # ── Windows ──────────────────────────────────────────────────────
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: cargo build --release -p spacespore -p spacespore-updater -p spacespore-launcher -p spacespore-installer

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dir = "spacespore-v${{ steps.version.outputs.VERSION }}-windows"
          New-Item -ItemType Directory -Path $dir
          Copy-Item target/release/spacespore.exe $dir/
          Copy-Item target/release/spacespore-updater.exe $dir/
          Copy-Item target/release/spacespore-launcher.exe $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          New-Item -ItemType Directory -Path dist
          Move-Item "$dir.zip" dist/
          Copy-Item target/release/spacespore-installer.exe dist/

      # ── Linux ────────────────────────────────────────────────────────
      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: cargo build --release -p spacespore -p spacespore-updater -p spacespore-launcher -p spacespore-installer

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          dir="spacespore-v${{ steps.version.outputs.VERSION }}-linux"
          mkdir -p "$dir" dist
          cp target/release/spacespore target/release/spacespore-updater target/release/spacespore-launcher "$dir/"
          cp run.sh "$dir/"
          chmod +x "$dir"/*
          zip -r "dist/$dir.zip" "$dir"
          # tar.gz : conserve le droit d'exécution après téléchargement
          mkdir -p installer && cp target/release/spacespore-installer installer/
          chmod +x installer/spacespore-installer
          tar -czf dist/spacespore-installer-linux.tar.gz -C installer spacespore-installer

      # ── macOS (binaire universel Apple Silicon + Intel) ──────────────
      - name: Build (macOS)
        if: matrix.platform == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p spacespore -p spacespore-updater -p spacespore-launcher -p spacespore-installer
          done
          mkdir -p target/universal
          for bin in spacespore spacespore-updater spacespore-launcher spacespore-installer; do
            lipo -create \
              target/aarch64-apple-darwin/release/$bin \
              target/x86_64-apple-darwin/release/$bin \
              -output target/universal/$bin
          done

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          # make_app <dossier .app> <nom> <identifiant>
          make_app() {
            mkdir -p "$1/Contents/MacOS"
            cat > "$1/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>$2</string>
              <key>CFBundleDisplayName</key><string>$2</string>
              <key>CFBundleIdentifier</key><string>$3</string>
              <key>CFBundleVersion</key><string>$VER</string>
              <key>CFBundleShortVersionString</key><string>$VER</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleExecutable</key><string>$2</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          }

          dir="spacespore-v$VER-macos"
          mkdir -p "$dir" dist
          cp target/universal/spacespore target/universal/spacespore-updater target/universal/spacespore-launcher "$dir/"
          # SpaceSpore.app : double-clic dans le Finder -> lance le launcher (sans Terminal)
          make_app "$dir/SpaceSpore.app" SpaceSpore io.github.liolu.spacespore
          printf '#!/bin/bash\ncd "$(dirname "$0")/../../.."\nexec ./spacespore-launcher\n' > "$dir/SpaceSpore.app/Contents/MacOS/SpaceSpore"
          chmod +x "$dir"/spacespore* "$dir/SpaceSpore.app/Contents/MacOS/SpaceSpore"
          # Signature ad-hoc : obligatoire pour exécuter sur Apple Silicon
          for f in "$dir"/spacespore*; do codesign --force --sign - "$f"; done
          zip -ry "dist/$dir.zip" "$dir"

          # Installeur : "SpaceSpore Installer.app"
          inst="installer/SpaceSpore Installer.app"
          make_app "$inst" "SpaceSpore Installer" io.github.liolu.spacespore.installer
          cp target/universal/spacespore-installer "$inst/Contents/MacOS/SpaceSpore Installer"
          codesign --force --deep --sign - "$inst"
          (cd installer && zip -ry ../dist/spacespore-installer-macos.zip "SpaceSpore Installer.app")

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          IFS='.' read -r major minor patch <<< "$VER"
          # Doit correspondre à VERSION_CODE dans tools/common/src/lib.rs (0.5.0 -> 500)
          CODE=$(( major * 10000 + minor * 100 + patch ))
          echo "CODE=$CODE" >> $GITHUB_OUTPUT

      - name: Update version.json
        shell: bash
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}"
          NAME="spacespore-v${{ steps.version.outputs.VERSION }}"
          cat > docs/version.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "version_code": ${{ steps.version.outputs.CODE }},
            "release_date": "$(date -u +%Y-%m-%d)",
            "download_url": "$BASE/$NAME-windows.zip",
            "download_url_linux": "$BASE/$NAME-linux.zip",
            "download_url_macos": "$BASE/$NAME-macos.zip",
            "release_notes": "See release page for details",
            "min_updater_version": 1
          }
          EOF

      - name: Commit version.json update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/version.json /tmp/version.json
          git fetch origin main
          git checkout -f origin/main
          cp /tmp/version.json docs/version.json
          git add docs/version.json
          git diff --cached --quiet || git commit -m "Update version.json for v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
