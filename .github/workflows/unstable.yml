# VERSION INSTABLE : se lance automatiquement à chaque push sur "main".
# Pas de vraie release : les zips sont mis dans la pré-release "unstable"
# (toujours la même, remplacée à chaque fois) avec unstable.json, que le
# launcher lit en mode "Instable".
name: Instable

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Si deux push arrivent vite, seul le plus récent est publié.
concurrency:
  group: unstable
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
      code: ${{ steps.v.outputs.CODE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Numero de version
        id: v
        shell: bash
        run: |
          BASE=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          LAST=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -1)
          VER=$(printf '%s\n%s\n' "$BASE" "${LAST:-0.0.0}" | sort -V | tail -1)
          IFS='.' read -r major minor patch <<< "$VER"
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "CODE=$(( major * 10000 + minor * 100 + patch ))" >> $GITHUB_OUTPUT

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: unstable
      build: ${{ github.run_number }}
      name: spacespore-unstable

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VER: ${{ needs.version.outputs.version }}
      CODE: ${{ needs.version.outputs.code }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the "unstable" pre-release
        shell: bash
        run: |
          MSG=$(git log -1 --no-merges --format=%s)
          NOTES="Build $BUILD : $MSG"
          BASE="https://github.com/${{ github.repository }}/releases/download/unstable/spacespore-unstable"
          jq -n --arg v "$VER" --argjson code "$CODE" --argjson build "$BUILD" \
                --arg base "$BASE" --arg notes "$NOTES" '{
            version: $v, version_code: $code, build: $build,
            download_url: ($base + "-windows.zip"),
            download_url_linux: ($base + "-linux.zip"),
            download_url_macos: ($base + "-macos.zip"),
            release_notes: $notes, min_updater_version: 1 }' > unstable.json
          cat unstable.json

          # Déplace le tag "unstable" sur ce commit
          git tag -f unstable "$GITHUB_SHA"
          git push -f origin refs/tags/unstable

          if ! gh release view unstable > /dev/null 2>&1; then
            gh release create unstable --prerelease --latest=false \
              --title "Version instable" --notes "$NOTES"
          fi
          gh release edit unstable --prerelease --latest=false \
            --title "Version instable (build $BUILD)" \
            --notes "Version de test mise a jour automatiquement a chaque modification. $NOTES"
          # Les zips d'abord, unstable.json en dernier : le launcher ne voit
          # le nouveau build qu'une fois tous les fichiers en ligne.
          gh release upload unstable dist/*.zip --clobber
          gh release upload unstable unstable.json --clobber
